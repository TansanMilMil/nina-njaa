services:
  backend:
    image: ghcr.io/tansanmilmil/nina-njaa-backend:${NINA_NJAA_IMAGE_TAG:-local}
    build: ./backend
    environment:
      - NINA_NJAA_GOOGLE_CLIENT_ID=${NINA_NJAA_GOOGLE_CLIENT_ID}
      - NINA_NJAA_GOOGLE_CLIENT_SECRET=${NINA_NJAA_GOOGLE_CLIENT_SECRET}
      - NINA_NJAA_GOOGLE_REDIRECT_URI=${NINA_NJAA_GOOGLE_REDIRECT_URI}
      - NINA_NJAA_GOOGLE_ALLOWED_ACCOUNTS=${NINA_NJAA_GOOGLE_ALLOWED_ACCOUNTS}
      - NINA_NJAA_DB_PATH=/app/db/recipes.db
      - NINA_NJAA_OPENAI_API_KEY=${NINA_NJAA_OPENAI_API_KEY}
      - NINA_NJAA_TYPESAFE_API_KEY=${NINA_NJAA_TYPESAFE_API_KEY}
      - NINA_NJAA_JWT_SECRET_KEY=${NINA_NJAA_JWT_SECRET_KEY}
    volumes:
      - ./db:/app/db
      - uploads:/app/uploads
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/tansanmilmil/nina-njaa-frontend:${NINA_NJAA_IMAGE_TAG:-local}
    build:
      context: ./frontend
    volumes:
      - static:/static
    networks:
      - app-net

  nginx:
    image: ghcr.io/tansanmilmil/nina-njaa-nginx:${NINA_NJAA_IMAGE_TAG:-local}
    build:
      context: ./nginx
    environment:
      - NINA_NJAA_CLOUDFRONT_SECRET=${NINA_NJAA_CLOUDFRONT_SECRET:-}
    ports:
      - "8090:80"
    volumes:
      - static:/usr/share/nginx/html
      - uploads:/usr/share/nginx/uploads
      - ./logs/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

volumes:
  static:
  uploads:

networks:
  app-net:
    driver: bridge
