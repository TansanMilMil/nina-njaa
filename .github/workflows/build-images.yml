name: Build images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/tansanmilmil/nina-njaa

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Test backend
        run: docker run --rm "$IMAGE_PREFIX-backend:$GITHUB_SHA" python -m unittest discover -p 'test_*.py'

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build nginx
        uses: docker/build-push-action@v6
        with:
          context: nginx
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-nginx:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Push images
        run: |
          for service in backend frontend nginx; do
            docker push "$IMAGE_PREFIX-$service:$GITHUB_SHA"
          done
